
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Flower for You 🌷</title>

    <meta name="description" content="A little flower, a sincere apology, and words from my heart.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- HALAMAN PEMBUKA -->
        <section class="intro" id="intro">

            <div class="flower-icon">🌷</div>

            <p class="small-text">A LITTLE MESSAGE FOR YOU</p>

            <h1>A Flower for You</h1>

            <p class="intro-description">
                Ada sesuatu yang ingin kusampaikan...
            </p>

            <button class="open-button" id="openButton">
                Buka pesan kecilku ♡
            </button>

            <p class="footer-text">
                Made with sincerity ♡
            </p>

        </section>


        <!-- HALAMAN PESAN -->
        <section class="message" id="message">

            <div class="message-flower">🌸</div>

            <p class="small-text">A MESSAGE FROM MY HEART</p>

            <h2>I'm Sorry...</h2>

            <div class="divider"></div>

            <div id="typing"></div>

            <div class="closing" id="closing">

                <div class="closing-flower">🌷</div>

                <p>
                    Semoga hari-harimu selalu
                    seindah bunga yang bermekaran.
                </p>

                <span>Nurma Putrii, ♡</span>

            </div>

            <button class="music-button" id="musicButton">
                ♫ Matikan Musik
            </button>

            <p class="footer-text">
                A Flower for You ♡
            </p>

        </section>

    </main>


    <!-- AUDIO -->
    <audio id="bgMusic" loop preload="auto">
        <source src="assets/audio/imsorry.mp3" type="audio/mpeg">
    </audio>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
